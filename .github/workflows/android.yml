name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Verify Secret Injection
      run: |
        if grep -q "GOOGLE_API_KEY" local.properties; then
          echo "Key successfully written to local.properties"
        else
          echo "Failed to write key"
          exit 1
        fi
    - name: Build with Gradle
      run: ./gradlew assembleDebug -PGOOGLE_API_KEY="${{ secrets.GOOGLE_API_KEY }}"


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/**/*.apk
